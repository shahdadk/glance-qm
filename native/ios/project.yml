name: GlanceQM
options:
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0
targets:
  GlanceQM:
    type: application
    platform: iOS
    sources: [GlanceQM]
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: MetaWearablesDAT
        product: MWDATSpeech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahdad.glanceqm
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: GlanceQM
        INFOPLIST_FILE: GlanceQM/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: [GlanceQMTests]
  GlanceQMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GlanceQMTests]
    dependencies:
      - target: GlanceQM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahdad.glanceqm.tests
        GENERATE_INFOPLIST_FILE: YES
